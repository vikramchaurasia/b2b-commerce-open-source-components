<template lwc:render-mode="light">
    <!--
        Header slots (newCartButton, cartOptions, defaultPill) render exactly ONCE per state branch
        (empty / items) inside a single .cart-header-region, so each slot maps to one DOM node and
        stays single-click-selectable in the builder. On desktop the region is a plain block (layout
        unchanged); on mobile it becomes a CSS grid that reflows the same nodes.
    -->

    <!-- Empty cart state -->
    <template lwc:if={showEmptyState}>
        <!-- Header region (grid-reflowed on mobile) -->
        <div class="cart-header-region">
            <!-- Breadcrumb for empty cart state-->
            <nav
                class="breadcrumb"
                data-automation="emptyStateBreadcrumb">
                <slot name="emptyStateBreadcrumb"></slot>
            </nav>

            <!-- Cart header with default label and actions -->
            <header class="cart-header cart-header-with-actions">
                <div
                    class="cart-header-content"
                    data-automation="emptyHeaderLabel">
                    <slot name="emptyHeaderLabel"></slot>
                </div>
                <div
                    class="cart-header-actions"
                    data-automation="cartHeaderActions">
                    <div
                        class="cart-header-pill cart-pill-desktop"
                        data-automation="defaultPill">
                        <template lwc:if={_showDefaultPill}>
                            <slot name="defaultPill"></slot>
                        </template>
                    </div>
                    <div
                        class="cart-header-primary-actions"
                        data-automation="cartPrimaryActions">
                        <div
                            class="cart-header-new-cart-button"
                            data-automation="newCartButton">
                            <slot name="newCartButton"></slot>
                        </div>
                        <div
                            class="cart-view-cart-options-slot cart-view-cart-options--header"
                            data-automation="cartOptions"
                            onimportstarted={handleImportStarted}
                            oncartupdated={handleCartDetailsChange}
                            oncartshared={handleCartDetailsChange}
                            oncartexported={handleCartDetailsChange}
                            oncartdeleted={handleCartDeleted}>
                            <slot name="cartOptions"></slot>
                        </div>
                    </div>
                </div>
            </header>
            <!-- Cart description -->
            <template lwc:if={hasDescription}>
                <div class="cart-description-row">
                    <section
                        class="cart-description"
                        data-automation="emptyStateDescription">
                        <slot name="emptyStateDescription"></slot>
                    </section>
                </div>
            </template>
        </div>
        <!-- Shared cart collaboration UI (shown regardless of whether the cart has items). Status
             pill sits on the LEFT extreme; collaborators list sits on the RIGHT extreme (flex row,
             space-between). -->
        <div class="cart-collaboration-row">
            <div
                class="cart-collaboration-status"
                data-automation="collaborationStatus">
                <template lwc:if={_showCollaborationStatus}>
                    <span
                        lwc:if={_collaborationStatus.isOwnerOrPersonalView}
                        class="sharing-status">
                        {_collaborationStatus.sharingStatusText}
                    </span>
                    <div
                        lwc:else
                        class="shared-by-line">
                        <span
                            lwc:if={_hasSharedBySegments}
                            class="shared-by-text">
                            {_collaborationStatus.sharedByTextSegments.before}
                            <strong class="access-level">{_collaborationStatus.sharedByTextSegments.access}</strong>
                            {_collaborationStatus.sharedByTextSegments.after}
                        </span>
                        <span
                            lwc:else
                            class="shared-by-text">
                            {_collaborationStatus.sharedByText}
                        </span>
                    </div>
                </template>
            </div>
            <div
                class="cart-collaborator-list"
                data-automation="cartCollaboratorList">
                <slot name="cartCollaboratorList"></slot>
            </div>
        </div>
        <!-- Visual divider between header and empty state content; hidden when cart is cleared -->
        <div
            lwc:if={_showDivider}
            class="section-divider"
            aria-hidden="true"></div>

        <!-- Async cart operation state (in-progress / cleared) -->
        <section
            class="cart-view-async-state"
            data-automation="cartAsyncStateView"
            oncartupdated={handleCartUpdated}
            oncartoperationreimport={handleReimport}>
            <slot name="cartAsyncStateView"></slot>
        </section>

        <!-- Empty cart illustration and body content -->
        <section class="empty">
            <div
                class="empty-body"
                data-automation="emptyBody">
                <img
                    src={_emptyCartImageUrl}
                    width="280"
                    height="206"
                    aria-hidden="true" />
                <slot name="emptyBody"></slot>
            </div>
        </section>
    </template>

    <!-- No-cart state: no cart record exists -->
    <template lwc:if={showNoCartState}>
        <div class="cart-header-region cart-header-region--no-cart">
            <nav
                class="breadcrumb"
                data-automation="emptyStateBreadcrumb">
                <slot name="emptyStateBreadcrumb"></slot>
            </nav>

            <!-- Cart header: hardcoded label, Default pill, New Cart button only -->
            <header class="cart-header cart-header-with-actions">
                <div
                    class="cart-header-content"
                    data-automation="noCartHeaderLabel">
                    <h1 class="cart-header-title">{_labels.noCartHeaderLabel}</h1>
                </div>
                <div
                    class="cart-header-actions"
                    data-automation="noCartHeaderActions">
                    <div
                        class="cart-header-pill cart-pill-desktop"
                        data-automation="defaultPill">
                        <template lwc:if={_showDefaultPill}>
                            <slot name="defaultPill"></slot>
                        </template>
                    </div>
                    <div
                        class="cart-header-new-cart-button"
                        data-automation="newCartButton">
                        <slot name="newCartButton"></slot>
                    </div>
                </div>
            </header>
        </div>

        <!-- No-cart illustration and body content -->
        <div
            class="section-divider"
            aria-hidden="true"></div>
        <section class="no-cart">
            <div
                class="no-cart-body"
                data-automation="emptyBody">
                <img
                    src={_emptyCartImageUrl}
                    width="280"
                    height="206"
                    aria-hidden="true" />
                <slot name="emptyBody"></slot>
            </div>
        </section>
    </template>

    <!-- Items state -->
    <template lwc:if={showItemState}>
        <section
            class="items"
            oncartupdatestatus={handleCartUpdateStatus}>
            <!-- Header region (grid-reflowed on mobile) -->
            <div class="cart-header-region">
                <!-- Breadcrumb for cart with items -->
                <template lwc:if={isCartPresent}>
                    <nav
                        class="breadcrumb"
                        data-automation="itemsBreadcrumb">
                        <slot name="itemsBreadcrumb"></slot>
                    </nav>
                </template>

                <!-- Cart level messages -->
                <site-common-scoped-notification
                    lwc:if={message}
                    class="cart-message slds-m-bottom_small"
                    data-automation="cartMessage"
                    header-text={message.message}
                    type={messageSeverity}></site-common-scoped-notification>

                <!-- Cart header label, item count, and actions -->
                <header class="cart-header cart-header-with-actions">
                    <div class="cart-header-content">
                        <div class="cart-header-title-row">
                            <div
                                class="cart-header-item"
                                data-automation="itemsHeaderLabel">
                                <slot name="itemsHeaderLabel"></slot>
                            </div>
                            <div
                                class="cart-header-item"
                                data-automation="itemsHeaderCount">
                                <slot name="itemsHeaderCount"></slot>
                            </div>
                        </div>
                    </div>

                    <div
                        class="cart-header-actions"
                        data-automation="cartHeaderActions">
                        <!--
                            Items-branch header actions use DISTINCT slot names (itemsDefaultPill /
                            itemsNewCartButton / itemsCartOptions) from the empty branch's slots
                            (defaultPill / newCartButton / cartOptions). Mirroring the
                            emptyHeaderLabel/itemsHeaderLabel pattern, separate names give each state
                            its OWN single DOM node, so both the empty (top) and items (bottom) cards
                            render the controls AND each is independently single-click-selectable in
                            Experience Builder when both states are forced at design time.
                        -->
                        <!-- Default pill; outlet always renders, the parent gates via _showDefaultPill (isSecondary / isCartOwner / design-mode). -->
                        <div
                            class="cart-header-pill cart-pill-desktop"
                            data-automation="itemsDefaultPill">
                            <template lwc:if={_showDefaultPill}>
                                <slot name="itemsDefaultPill"></slot>
                            </template>
                        </div>
                        <div
                            class="cart-header-primary-actions"
                            data-automation="cartPrimaryActions">
                            <!-- New Cart slot; shown when a cart is present. -->
                            <div
                                lwc:if={isCartPresent}
                                class="cart-header-new-cart-button"
                                data-automation="itemsNewCartButton">
                                <slot name="itemsNewCartButton"></slot>
                            </div>
                            <!-- Cart Options Menu slot -->
                            <div
                                class="cart-view-cart-options-slot cart-view-cart-options--header"
                                data-automation="itemsCartOptions"
                                onimportstarted={handleImportStarted}
                                oncartupdated={handleCartDetailsChange}
                                oncartshared={handleCartDetailsChange}
                                oncartexported={handleCartDetailsChange}
                                oncartdeleted={handleCartDeleted}>
                                <slot name="itemsCartOptions"></slot>
                            </div>
                        </div>
                    </div>
                </header>

                <template lwc:if={hasDescription}>
                    <div class="cart-description-row">
                        <!-- Cart description -->
                        <section
                            class="cart-description"
                            data-automation="itemsDescription">
                            <slot name="itemsDescription"></slot>
                        </section>
                    </div>
                </template>
            </div>
            <!-- Shared cart collaboration UI. Status pill sits on the LEFT extreme; collaborators
                 list sits on the RIGHT extreme (flex row, space-between). -->
            <div class="cart-collaboration-row">
                <div
                    class="cart-collaboration-status"
                    data-automation="itemsCollaborationStatus">
                    <template lwc:if={_showCollaborationStatus}>
                        <span
                            lwc:if={_collaborationStatus.isOwnerOrPersonalView}
                            class="sharing-status">
                            {_collaborationStatus.sharingStatusText}
                        </span>
                        <div
                            lwc:elseif={_collaborationStatus.isRecipientView}
                            class="shared-by-line">
                            <span
                                lwc:if={_collaborationStatus.sharedByTextSegments}
                                class="shared-by-text">
                                {_collaborationStatus.sharedByTextSegments.before}
                                <strong class="access-level">{_collaborationStatus.sharedByTextSegments.access}</strong>
                                {_collaborationStatus.sharedByTextSegments.after}
                            </span>
                            <span
                                lwc:else
                                class="shared-by-text">
                                {_collaborationStatus.sharedByText}
                            </span>
                        </div>
                    </template>
                </div>
                <div
                    class="cart-collaborator-list"
                    data-automation="itemsCartCollaboratorList">
                    <slot name="itemsCartCollaboratorList"></slot>
                </div>
            </div>
            <!-- Visual divider between header and items content; hidden while the async
                 operation banner is shown. -->
            <div
                lwc:if={_showDivider}
                class="section-divider"
                aria-hidden="true"></div>
            <!-- Async cart operation state (in-progress / cleared) -->
            <section
                class="cart-view-async-state"
                data-automation="cartAsyncStateViewItems"
                oncartupdated={handleCartUpdated}
                oncartoperationreimport={handleReimport}>
                <slot name="cartAsyncStateViewItems"></slot>
            </section>
            <!-- Sort options dropdown-->
            <template lwc:if={showSortOptions}>
                <div class="sort-container">
                    <lightning-combobox
                        class="sort-menu"
                        lwc:ref="sortMenu"
                        label={_labels.sortByLabelText}
                        value={selectedSortOrder}
                        options={sortOptions}
                        disabled={_isSortDisabled}
                        onchange={handleSortChange}></lightning-combobox>
                </div>
            </template>
            <!-- Approaching Discounts threshold message -->
            <section data-automation="promotionDiscountsApproaching">
                <slot name="promotionDiscountsApproaching"></slot>
            </section>
            <!-- Cart items list -->
            <section data-automation="itemsBody">
                <slot name="itemsBody"></slot>
            </section>
        </section>
    </template>

    <!-- Spinner shown when cart data is loading -->
    <div
        lwc:if={showSpinner}
        class="cart-spinner slds-spinner_container">
        <div part="backdrop"></div>
        <div
            class="slds-spinner slds-spinner_brand slds-spinner_large"
            role="status"
            part="spinner">
            <span class="slds-assistive-text">{_labels.alternativeSpinnerText}</span>
            <div
                part="dot-a"
                class="slds-spinner__dot-a"></div>
            <div
                part="dot-b"
                class="slds-spinner__dot-b"></div>
        </div>
    </div>
</template>
