<template lwc:render-mode="light">
    <template lwc:if={showCollaboratorList}>
        <lightning-button-menu
            lwc:if={hasCollaborators}
            label={collaboratorLinkLabel}
            alternative-text={collaboratorAnnouncement}
            icon-name="utility:chevrondown"
            menu-alignment="auto"
            variant={variant}
            data-variant={variant}
            style={buttonStyle}
            class="collaborators-button-menu">
            <div
                role="list"
                class="collaborators-list">
                <template
                    for:each={collaborators}
                    for:item="collaborator">
                    <div
                        key={collaborator.id}
                        role="listitem"
                        tabindex="0"
                        aria-label={collaborator.ariaLabel}
                        class="collaborator-item">
                        <span
                            aria-hidden="true"
                            class="collaborator-name">
                            {collaborator.name}
                        </span>
                        <span
                            lwc:if={collaborator.hasEmail}
                            aria-hidden="true"
                            class="collaborator-email">
                            {collaborator.email}
                        </span>
                        <span
                            lwc:if={collaborator.hasAccessLevel}
                            aria-hidden="true"
                            class="collaborator-access-level">
                            {collaborator.accessLevelLabel}
                        </span>
                    </div>
                </template>
            </div>
        </lightning-button-menu>
    </template>
</template>
