<template lwc:render-mode="light">
    <template lwc:if={showButton}>
        <site-common-button-ui
            data-test-id="request-quote-button"
            variant={variant}
            size={size}
            width={width}
            style={buttonStyle}
            disabled={isDisabled}
            onclick={handleRequestQuote}>
            {buttonText}
        </site-common-button-ui>
    </template>
</template>
