<template lwc:render-mode="light">
    <div
        style={cartItemsStyles}
        class="cart-items-container">
        <site-cart-items-ui
            items={items}
            pagination={pagination}
            currency-iso-code={_currencyIsoCode}
            show-remove-item={_effectiveShowRemoveItem}
            show-modify-item={_showModifyItem}
            locked-for-viewer={lockedForViewer}
            has-active-async-operation={hasActiveAsyncOperation}
            show-product-image={showProductImage}
            show-product-variants={showProductVariants}
            show-price-per-unit={showPricePerUnit}
            show-total-prices={showTotalPrices}
            show-original-price={showOriginalPrice}
            show-actual-price={showActualPrice}
            hide-quantity-selector={hideQuantitySelector}
            disable-quantity-selector={_effectiveDisableQuantitySelector}
            show-quantity-selector-label={showQuantitySelectorLabel}
            quantity-selector-label={quantitySelectorLabel}
            show-count-in-name={showCountInName}
            remove-product-links={removeProductLinks}
            show-sku={showSku}
            sku-label={skuLabel}
            minimum-value-guide-text={minimumValueGuideText}
            maximum-value-guide-text={maximumValueGuideText}
            increment-value-guide-text={incrementValueGuideText}
            show-promotions={showPromotions}
            promotions-applied-savings-button-text={promotionsAppliedSavingsButtonText}
            product-field-mapping={productFieldMappingValue}
            oncartshowmore={handleCartShowMore}
            ondeletecartitem={handleDeleteCartItem}
            onupdatecartitem={handleUpdateCartItem}
            onnavigatetoproduct={handleProductNavigation}
            oncartgotopage={handleCartGoToPage}
            pagination-type={paginationTypeValue}
            disable-modify-item={disableModifyButton}
            onmodifycartitem={handleModifyButtonAction}
            show-view-bundle-detail={showSeeConfiguration}
            view-bundle-detail-label={viewBundleButtonLabel}
            onseeconfiguration={handleSeeConfiguration}>
            <section slot="showMore">
                <slot name="showMore"></slot>
            </section>
        </site-cart-items-ui>

        <!-- Spinner -->
        <template lwc:if={isLoadingConfiguration}>
            <div class="spinner-container">
                <lightning-spinner
                    variant="brand"
                    size="large"></lightning-spinner>
            </div>
        </template>
    </div>
</template>
