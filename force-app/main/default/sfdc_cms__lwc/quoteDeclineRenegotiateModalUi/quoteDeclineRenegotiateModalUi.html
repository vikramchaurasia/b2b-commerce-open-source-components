<template>
    <div class="modal-container">
        <lightning-modal-header
            class="modal-header"
            label={headerText}></lightning-modal-header>

        <lightning-modal-body>
            <template lwc:if={isNotSubmitting}>
                <div class="slds-grid slds-wrap modal-body-content">
                    <!-- Information icon -->
                    <div class="slds-col slds-size_1-of-1 info-icon-container slds-m-bottom_small">
                        <svg
                            class="info-icon"
                            width="48"
                            height="48"
                            viewBox="0 0 26 26"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                            focusable="false">
                            <path
                                fill-rule="evenodd"
                                clip-rule="evenodd"
                                d="M13.0002 1.29995C11.4142 1.29995 9.89753 1.61195 8.4502 2.23595C7.01153 2.85129 5.76786 3.68329 4.71919 4.73195C3.6792 5.77195 2.8472 7.01562 2.22319 8.46295C1.60786 9.90162 1.30019 11.414 1.3002 13C1.3002 14.586 1.60786 16.1026 2.2232 17.55C2.8472 18.9886 3.6792 20.2323 4.7192 21.281C5.76786 22.321 7.01153 23.1486 8.4502 23.764C9.89753 24.388 11.4142 24.7 13.0002 24.7C14.5862 24.7 16.0985 24.388 17.5372 23.764C18.9845 23.1486 20.2282 22.321 21.2682 21.281C22.3169 20.2323 23.1489 18.9886 23.7642 17.5499C24.3882 16.1026 24.7002 14.586 24.7002 13C24.7002 11.414 24.3882 9.90162 23.7642 8.46295C23.1489 7.01562 22.3169 5.77195 21.2682 4.73195C20.2282 3.68329 18.9845 2.85128 17.5372 2.23595C16.0985 1.61195 14.5862 1.29995 13.0002 1.29995ZM13.0001 9.74993C13.3554 9.74993 13.6588 9.62426 13.9101 9.37293C14.1701 9.11293 14.3001 8.80526 14.3001 8.44993C14.3001 8.0946 14.1701 7.79126 13.9101 7.53993C13.6588 7.27993 13.3554 7.14993 13.0001 7.14993C12.6448 7.14993 12.3371 7.27993 12.0771 7.53993C11.8258 7.79126 11.7001 8.0946 11.7001 8.44993C11.7001 8.80526 11.8258 9.11293 12.0771 9.37293C12.3371 9.62426 12.6448 9.74993 13.0001 9.74993ZM13.0001 19.4999C13.2774 19.4999 13.5071 19.4046 13.6891 19.2139C13.8798 19.0233 13.9751 18.7849 13.9751 18.4989L13.9751 12.6879C13.9751 12.4019 13.8798 12.1679 13.6891 11.9859C13.5071 11.7953 13.2774 11.6999 13.0001 11.6999C12.7228 11.6999 12.4888 11.7953 12.2981 11.9859C12.1161 12.1679 12.0251 12.4019 12.0251 12.6879L12.0251 18.5119C12.0251 18.7979 12.1161 19.0363 12.2981 19.2269C12.4888 19.4089 12.7228 19.4999 13.0001 19.4999Z"
                                fill="#EAB24B"></path>
                        </svg>
                    </div>

                    <!-- Subheading -->
                    <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                        <p class="modal-subheading"><b>{subheadingText}</b></p>
                    </div>

                    <!-- Notes Textarea -->
                    <div class="slds-col slds-size_1-of-1">
                        <lightning-textarea
                            name="notes"
                            label={notesPlaceholder}
                            value={notes}
                            onchange={handleNotesChange}
                            class="notes-textarea"></lightning-textarea>
                    </div>
                </div>
            </template>
            <template lwc:else>
                <div class="slds-p-vertical_x-large slds-align_absolute-center">
                    <lightning-spinner
                        alternative-text="Loading"
                        size="medium"
                        variant="brand"></lightning-spinner>
                </div>
            </template>
        </lightning-modal-body>

        <lightning-modal-footer>
            <div class="slds-grid slds-grid_align-end">
                <button
                    onclick={handleDeclineClick}
                    name="declineButton"
                    disabled={isSubmitting}
                    class="slds-button slds-button_neutral slds-m-right_small">
                    {declineButtonLabel}
                </button>
                <button
                    onclick={handleRenegotiateClick}
                    name="renegotiateButton"
                    disabled={isSubmitting}
                    class="slds-button slds-button_brand">
                    {renegotiateButtonLabel}
                </button>
            </div>
        </lightning-modal-footer>
    </div>
</template>
